<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIS // Body Archive</title><style>
:root{--bg:#090b0c;--panel:#111719;--line:#273638;--green:#d6ff3f;--cyan:#54e6da;--muted:#9ba9ad;--danger:#ff8c74}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#1d302c 0,#090b0c 42%);color:#edf4ef;font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}a{color:var(--green)}.wrap{max-width:1180px;margin:auto;padding:28px 20px 60px}.top{display:flex;justify-content:space-between;gap:18px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:18px}.eyebrow{color:var(--cyan);letter-spacing:.16em;font-size:11px}.title{font:700 clamp(34px,7vw,72px)/.9 system-ui,sans-serif;letter-spacing:-.06em;margin:10px 0}.sub{color:var(--muted);max-width:620px}.back{white-space:nowrap}.layout{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;margin-top:22px}.panel{background:rgba(17,23,25,.88);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 18px 60px #0005}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.filter{border:1px solid var(--line);border-radius:999px;background:#101617;color:var(--muted);padding:8px 12px;cursor:pointer;font:inherit;font-size:12px}.filter.active,.filter:hover{border-color:var(--green);color:var(--green)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:12px;padding:13px;background:#0c1112;cursor:pointer;transition:.2s transform,.2s border-color}.card:hover,.card.selected{transform:translateY(-3px);border-color:var(--cyan)}.sil{height:150px;display:grid;place-items:center;background:linear-gradient(135deg,#131e1e,#0b1011);border-radius:9px;margin-bottom:11px;overflow:hidden}.bot{position:relative;width:72px;height:108px;color:var(--cyan);filter:drop-shadow(0 0 12px currentColor)}.bot i{position:absolute;display:block;background:currentColor;border-radius:5px}.bot .head{width:45px;height:32px;left:14px;top:2px;border:5px solid currentColor;background:transparent;border-radius:12px}.bot .head:after{content:'••';letter-spacing:10px;position:absolute;left:8px;top:0;color:currentColor}.bot .body{width:53px;height:40px;left:9px;top:42px;border:5px solid currentColor;background:transparent}.bot .arm{width:9px;height:45px;top:45px}.bot .l{left:0;transform:rotate(12deg)}.bot .r{right:0;transform:rotate(-12deg)}.bot .leg{width:10px;height:35px;top:83px}.bot .ll{left:19px}.bot .rr{right:19px}.meta{display:flex;justify-content:space-between;gap:8px}.id{color:var(--green);font-weight:700}.tag{color:var(--muted);font-size:11px}.detail h2{margin:4px 0;color:var(--green);font-size:20px}.detail p{color:var(--muted)}.spec{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0}.spec div{border-top:1px solid var(--line);padding-top:7px}.spec b{display:block;color:#eff8ef;font-size:13px}.spec span{color:var(--muted);font-size:12px}.badge{display:inline-block;border:1px solid var(--cyan);color:var(--cyan);border-radius:999px;padding:3px 8px;font-size:11px}.btn{width:100%;border:0;border-radius:8px;padding:11px;background:var(--green);color:#101510;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.log{margin-top:20px;color:var(--muted);font-size:12px}.log li{margin:6px 0}.empty{color:var(--muted);padding:30px;text-align:center;grid-column:1/-1}@media(max-width:760px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.top{display:block}.back{display:block;margin-top:14px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">SIS / COMPONENT ARCHIVE / v0.1</div><h1 class="title">BODY<br>ARCHIVE</h1><p class="sub">A local design index for interchangeable machine bodies. Select a chassis to inspect its work profile, damage state, and current host assignment.</p></div><a class="back" href="index.html">← return to core</a></header><section class="layout"><div class="panel"><div class="toolbar" id="filters"></div><div class="grid" id="cards"></div></div><aside class="panel detail" id="detail" aria-live="polite"></aside></section></main><script>
(()=>{const bodies=[{id:'SIS-01',canonical:'ORCHARD-01',name:'ORCHARD',form:'HUMANOID',role:'General labor chassis',state:'serviceable',color:'#54e6da',parts:'Hands / sensor head / tool belt',note:'Balanced frame for repetitive work and repair tasks.'},{id:'SIS-02',canonical:'SPARKY-02',name:'SPARKY',form:'CRAWLER',role:'Infrastructure runner',state:'scuffed',color:'#d6ff3f',parts:'Six wheels / cable arm / beacon',note:'Low profile body for tight routes and power-room work.'},{id:'SIS-03',canonical:'TRASHMAN-03',name:'TRASHMAN',form:'ROLLING',role:'Collection and sorting',state:'patched',color:'#ffb45c',parts:'Shell panels / intake / magnetic feet',note:'Can fold into a sealed rolling shell between shifts.'},{id:'SIS-04',canonical:'LOTUS-04',name:'LOTUS',form:'SWARM',role:'Adaptive scout body',state:'damaged',color:'#ff8c74',parts:'Petal armor / core eye / micro-legs',note:'Modular panels detach and reform around a surviving core.'}];let filter='ALL',selected=bodies[0],assigned=null;const q=s=>document.querySelector(s);const filters=['ALL','HUMANOID','ROLLING','CRAWLER','SWARM'];q('#filters').innerHTML=filters.map(x=>`<button class="filter ${x==='ALL'?'active':''}" data-filter="${x}">${x}</button>`).join('');function icon(b){return `<div class="sil"><div class="bot" style="color:${b.color}"><i class="head"></i><i class="body"></i><i class="arm l"></i><i class="arm r"></i><i class="leg ll"></i><i class="leg rr"></i></div></div>`}function draw(){const list=bodies.filter(b=>filter==='ALL'||b.form===filter);q('#cards').innerHTML=list.length?list.map(b=>`<article class="card ${selected.id===b.id?'selected':''}" data-id="${b.id}">${icon(b)}<div class="meta"><span class="id">${b.canonical} / ${b.name}</span><span class="tag">legacy ${b.id} · ${b.form}</span></div><div class="tag">${b.role}</div></article>`).join(''):`<div class="empty">No bodies in this form class.</div>`;q('#detail').innerHTML=`<div class="eyebrow">SELECTED FRAME</div><h2>${selected.name} <span class="badge">${selected.state}</span></h2><p>${selected.note}</p><div class="spec"><div><span>CANONICAL ID</span><b>${selected.canonical}</b></div><div><span>LEGACY ID</span><b>${selected.id}</b></div><div><span>FORM</span><b>${selected.form}</b></div><div><span>ROLE</span><b>${selected.role}</b></div><div><span>PARTS</span><b>${selected.parts}</b></div><div><span>HOST</span><b>${assigned===selected.id?'ORCHARD / MOCK':'UNASSIGNED'}</b></div></div><button class="btn" id="assign">${assigned===selected.id?'Release mock host':'Assign mock host'}</button><ol class="log"><li>Archive index loaded locally.</li><li>Canonical IDs map to the legacy SIS IDs shown on each card.</li><li>Design data is illustrative; no network or wallet state.</li></ol>`;document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{selected=bodies.find(b=>b.id===c.dataset.id);draw()});q('#assign').onclick=()=>{assigned=assigned===selected.id?null:selected.id;draw()}}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));draw()});draw()})();</script></body></html>
